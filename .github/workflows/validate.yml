name: Static site validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pages and JavaScript
        run: |
          node --version
          python3 scripts/check_site.py
          python3 scripts/validate.py
          git diff --check
